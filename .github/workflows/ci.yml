name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones, seed y pruebas de RLS en Postgres
        # El runner trae Postgres instalado (servicio apagado). Se corre como el usuario
        # runner, que no es root, así initdb funciona sin sudo.
        run: |
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
          fi
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1) npm run db:test
