name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones, seed y pruebas de RLS en Postgres
        run: |
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          sudo chmod -R a+rX "$GITHUB_WORKSPACE"
          sudo -u postgres env PGBIN="$PGBIN" bash -c "cd '$GITHUB_WORKSPACE' && bash supabase/tests/run_local.sh"
