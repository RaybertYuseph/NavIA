# Configuración mínima para `npx supabase start` (requiere Docker).
project_id = "navia"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]

# Login con código de un solo uso al correo (signInWithOtp + verifyOtp type 'email').
[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

# La plantilla por defecto manda un enlace; la nuestra manda el código ({{ .Token }}).
[auth.email.template.magic_link]
subject = "Tu código de NavIA"
content_path = "./supabase/templates/codigo.html"

[auth.email.template.confirmation]
subject = "Tu código de NavIA"
content_path = "./supabase/templates/codigo.html"

[inbucket]
enabled = true
port = 54324

[realtime]
enabled = true
